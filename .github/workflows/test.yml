name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: crewmatch
          POSTGRES_PASSWORD: crewmatch
          POSTGRES_DB: crewmatch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crewmatch"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://crewmatch:crewmatch@localhost:5432/crewmatch_test
      REQUIRE_DB_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
